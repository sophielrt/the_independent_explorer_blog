<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Views</title>
</head>

<body>
    <h1>Blogs</h1>
    {% for post in object_list %}
    <h2>{{ post.title }}</h2>
    <p>Destination: {{ post.destination }}</p>
    <p>Estimated read time: {{ post.read_time }} minutes</p>
    <p>{{ post.excerpt }}</p>
    {% endfor %}
</body>


</html>
