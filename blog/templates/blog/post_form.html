{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="container section">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="mb-4">{{ action }} Post</h2>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="mt-3">
                    <button type="submit" class="btn">{{ action }} Post</button>
                    <a href="{% url 'admin_dashboard' %}" class="btn">Cancel</a>
                </div>
            </form>
            
        </div>
    </div>
</section>

{% endblock %}
