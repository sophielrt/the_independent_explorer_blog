{% load static %}

{% url 'home' as home_url %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Independent Explorer</title>

    <!-- Bootsrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Custom CSS-->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>

    <!-- Navbar -->

    <!-- Footer -->
    <footer class="footer mt-auto">
        <!-- Social Media Links -->
        <div class="text-center">
            <!-- Instagram -->
            <a href="https://www.instagram.com" target="_blank"
                aria-label="Visit The Independent Explorer Instagram Page (Opens in a new tab)">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <!-- Facebook -->
            <a href="https://www.facebook.com" target="_blank"
                aria-label="Visit The Independent Explorer Facebook Page (Opens in a new tab)">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <!-- X -->
            <a href="https://www.twitter.com" target="_blank"
                aria-label="Visit The Independent Explorer X Page (Opens in a new tab)">
                <i class="fa-brands fa-x-twitter"></i>
            </a>
            <!-- Youtube -->
            <a href="https://www.youtube.com" target="_blank"
                aria-label="Visit The Independent Explorer Youtube Page (Opens in a new tab)">
                <i class="fa-brands fa-youtube"></i>
            </a>
            <!-- TikTok -->
            <a href="https://www.tiktok.com" target="_blank"
                aria-label="Visit The Independent Explorer TikTok Page (Opens in a new tab)">
                <i class="fa-brands fa-tiktok"></i>
            </a>
        </div>
    </footer>

    <!-- Bootstrap 5.3.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
        </script>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/e8014a6adf.js" crossorigin="anonymous"></script>

</body>

</html>
